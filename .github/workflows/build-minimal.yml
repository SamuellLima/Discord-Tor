name: build-discord-tor

on:
  workflow_dispatch:
  push:
    paths:
      - 'golive-minimal/**'
      - '.github/workflows/build-minimal.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: golive-minimal/go.mod
      - run: go test ./...
        working-directory: golive-minimal
      - name: Build native Windows launcher
        working-directory: golive-minimal
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -buildvcs=true -ldflags="-s -w" -o GoLiveTor.exe ./cmd/golive-tor
          (Get-FileHash -Algorithm SHA256 .\GoLiveTor.exe).Hash.ToLower() | Set-Content -NoNewline GoLiveTor.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GoLiveTor-windows-amd64
          path: |
            golive-minimal/GoLiveTor.exe
            golive-minimal/GoLiveTor.exe.sha256
          if-no-files-found: error
